# Install: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-policy
        name: validate policy.json and examples
        entry: scripts/check_policy.sh
        language: system
        pass_filenames: false
        files: ^(v1/policy\.json|examples/v1/.*|schema/.*|keys/.*|scripts/.*)$
      - id: pytest
        name: pytest
        entry: python -m pytest -q tests
        language: system
        pass_filenames: false
        files: ^(scripts|tests|schema|examples)/
