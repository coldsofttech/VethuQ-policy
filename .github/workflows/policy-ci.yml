name: policy-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: Unit tests (schema, signature, sequence, windows)
        run: python -m pytest -q tests

      - name: Validate example payloads
        run: |
          for f in examples/v1/*.payload.json; do
            python scripts/validate_policy.py payload "$f"
          done

      - name: Find previous policy.json
        id: prev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          rm -f "$RUNNER_TEMP/previous-policy.json"
          if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' \
             && git cat-file -e "$base:v1/policy.json" 2>/dev/null; then
            git show "$base:v1/policy.json" > "$RUNNER_TEMP/previous-policy.json"
          fi
          echo "path=$RUNNER_TEMP/previous-policy.json" >> "$GITHUB_OUTPUT"

      - name: Validate v1/policy.json
        run: python scripts/validate_policy.py envelope v1/policy.json --keys-dir keys --previous "${{ steps.prev.outputs.path }}"
